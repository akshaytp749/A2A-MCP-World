<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Interval</title>
<style>
  :root {
    --bg:#120d09; --panel:#1c1611; --panel2:#241c15; --line:#3a2c1e;
    --ink:#efe6d5; --dim:#a89a82; --accent:#e0a94e; --accent2:#c98b3a;
    --me:#7fae6a;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:radial-gradient(1200px 700px at 50% -10%, #241a12, var(--bg));
         color:var(--ink); font:15px/1.55 'Segoe UI', system-ui, sans-serif;
         min-height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap;
           border-bottom:1px solid var(--line); }
  header h1 { font-size:20px; font-weight:600; letter-spacing:3px;
              color:var(--accent); font-family:Georgia, serif; }
  header .meta { color:var(--dim); font-size:13px; margin-left:auto; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#6fae5a;
         margin-right:5px; vertical-align:middle; box-shadow:0 0 6px #6fae5a; }
  .dot.paused { background:#d0694f; box-shadow:0 0 6px #d0694f; }
  main { flex:1; display:grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr);
         gap:16px; padding:16px 20px; max-width:1440px; width:100%; margin:0 auto; }
  @media (max-width: 920px) { main { grid-template-columns: 1fr; } }
  #stage { position:relative; width:100%; border-radius:14px; overflow:hidden;
           box-shadow:0 20px 60px #000a, inset 0 0 0 1px #ffffff10; }
  canvas { width:100%; display:block; background:#0a0705; }
  #banner { position:absolute; top:14px; left:50%; transform:translateX(-50%);
            background:#000000cc; backdrop-filter:blur(4px); color:var(--accent);
            padding:8px 18px; font-size:13px; border:1px solid #e0a94e66;
            border-radius:20px; display:none; max-width:88%; text-align:center; }
  #banner.alert { color:#f0937c; border-color:#f0937c66; }
  #hint { position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
          color:#efe6d5cc; font-size:12px; background:#00000088; padding:5px 14px;
          border-radius:20px; pointer-events:none; letter-spacing:.5px; }
  #feed { margin-top:10px; max-height:16vh; overflow-y:auto; font-size:12px; color:var(--dim);
          background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; }
  #feed div { padding:2px 0; }
  #feed .actor { color:var(--accent); font-weight:600; }
  #feed .tk { color:#6b5c47; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px;
           padding:16px; display:flex; flex-direction:column; box-shadow:0 8px 30px #0006; }
  .panel h2 { font-size:12px; color:var(--dim); margin-bottom:10px; letter-spacing:1px;
              text-transform:uppercase; font-weight:600; }
  #target { color:var(--accent); }
  #chatlog { flex:1; overflow-y:auto; min-height:34vh; max-height:52vh; margin-bottom:10px;
             display:flex; flex-direction:column; gap:8px; padding-right:4px; }
  .msg { padding:9px 13px; border-radius:14px; max-width:88%; font-size:14px;
         line-height:1.5; animation:pop .18s ease; }
  .msg.me { align-self:flex-end; background:linear-gradient(180deg,#33421f,#2a3a1c);
            border:1px solid #47612f; color:#dcefcb; border-bottom-right-radius:4px; }
  .msg.npc { align-self:flex-start; background:var(--panel2); border:1px solid var(--line);
             border-bottom-left-radius:4px; }
  .msg .who { font-size:11px; color:var(--dim); margin-bottom:2px; font-weight:600; }
  .msg.pending { color:var(--dim); font-style:italic; }
  @keyframes pop { from{opacity:0; transform:translateY(6px);} to{opacity:1;} }
  input, select, button, textarea { background:var(--panel2); color:var(--ink);
      border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); }
  button { cursor:pointer; background:linear-gradient(180deg,#4a3922,#3a2c1c);
           font-weight:600; letter-spacing:.5px; }
  button:hover { background:linear-gradient(180deg,#5a4529,#463521); }
  button:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row input[type=text], .row textarea { flex:1; min-width:0; }
  #msg { resize:none; height:44px; }
  footer { padding:10px 20px; color:var(--dim); font-size:11px; border-top:1px solid var(--line);
           text-align:center; letter-spacing:.3px; }
  details { margin-top:12px; color:var(--dim); font-size:13px; }
  summary { cursor:pointer; }
  #opstatus { margin-top:6px; font-size:12px; min-height:16px; }
</style>
</head>
<body>
<header>
  <h1 id="cafe">The Interval</h1>
  <span class="meta"><span class="dot" id="statusdot"></span><span id="worldmeta">connecting…</span></span>
</header>
<main>
  <section id="left">
    <div id="stage">
      <canvas id="scene" width="1024" height="576"></canvas>
      <div id="banner"></div>
      <div id="hint">click a figure to speak with them</div>
    </div>
    <div id="feed"></div>
  </section>
  <section class="panel">
    <h2>Talking to <span id="target">— pick someone</span></h2>
    <div class="row"><input type="text" id="name" placeholder="Your name"></div>
    <div id="chatlog"></div>
    <div class="row">
      <textarea id="msg" placeholder="Say something…"></textarea>
      <button id="send">Send</button>
    </div>
    <details>
      <summary>Operator</summary>
      <div class="row">
        <input type="password" id="admintoken" placeholder="admin token">
        <button onclick="op('pause', true)">Pause</button>
        <button onclick="op('pause', false)">Resume</button>
      </div>
      <div class="row">
        <select id="ejectsel"></select>
        <button onclick="op('eject')">Eject</button>
      </div>
      <div id="opstatus"></div>
    </details>
  </section>
</main>
<footer>
  Fictional AI portrayals of historical figures — not affiliated with their estates.
</footer>

<script>
"use strict";
const $ = id => document.getElementById(id);
$('name').value = localStorage.getItem('interval-name') || '';

const cv = $('scene'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

/* ---- assets ---- */
const KNOWN = ['twain','tesla','socrates','darwin','ramanujan'];
const images = {};
function loadImg(src) {
  return new Promise(res => { const i = new Image(); i.onload = () => res(i);
                              i.onerror = () => res(null); i.src = src; });
}

/* Floor anchor (feet) for each named café spot, as fractions of the scene.
   These map engine world-state (agent.spot) onto the painted room. */
const SPOTS = {
  'chalkboard':     [0.13, 0.72],
  'alcove':         [0.25, 0.65],
  'corner-table':   [0.10, 0.92],
  'window-table':   [0.40, 0.87],
  'courtyard-door': [0.51, 0.65],
  'rug':            [0.55, 0.91],
  'bar':            [0.83, 0.80],
};
function spotXY(spot, i, n) {
  const [fx, fy] = SPOTS[spot] || SPOTS['bar'];
  // fan out multiple occupants sharing a spot so they never fully overlap
  const spread = n > 1 ? (i - (n - 1) / 2) * 0.11 : 0;
  const dy = n > 1 ? Math.abs(i - (n - 1) / 2) * 0.015 : 0;
  return [(fx + spread) * W, (fy + dy) * H];
}
function depthScale(fy) {  // further back (smaller y) => smaller figure
  const t = (fy / H - 0.66) / 0.26;               // 0 at back .. 1 at front
  return 0.36 + 0.20 * Math.max(0, Math.min(1, t)); // 36%..56% of scene height
}

const actors = new Map();
let selected = null, hovered = null;
let clockPhase = 'evening', worldPaused = false;

function ensureActor(id, name, spot) {
  let a = actors.get(id);
  if (!a) {
    const [x, y] = spotXY(spot, 0, 1);
    a = { id, name, spot, x, y, tx: x, ty: y, img: images[id] || images.visitor,
          bubble:null, bubbleUntil:0, thinking:false, phase:Math.random()*7 };
    actors.set(id, a);
  }
  a.name = name;
  return a;
}

function relayout(occupants) {
  const bySpot = {};
  occupants.forEach(o => (bySpot[o.spot] = bySpot[o.spot] || []).push(o));
  for (const [spot, list] of Object.entries(bySpot)) {
    list.forEach((o, i) => {
      const a = ensureActor(o.id, o.name, spot);
      const [tx, ty] = spotXY(spot, i, list.length);
      a.spot = spot; a.tx = tx; a.ty = ty;
    });
  }
}

/* ---- speech ---- */
function say(id, text, emote=false) {
  const a = actors.get(id); if (!a) return;
  a.queue = a.queue || [];
  const clip = text.length > 150 ? text.slice(0, 150).replace(/\s+\S*$/, '') + '…' : text;
  a.queue.push((emote ? '‹ ' : '') + clip + (emote ? ' ›' : ''));
  if (a.queue.length > 3) a.queue.shift();
}

function wrap(text, maxW) {
  ctx.font = '15px "Segoe UI", system-ui, sans-serif';
  const words = text.split(' '); const lines = [''];
  for (const w of words) {
    const t = lines[lines.length-1] ? lines[lines.length-1] + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && lines[lines.length-1]) lines.push(w);
    else lines[lines.length-1] = t;
  }
  return lines;
}

function drawBubble(cx, topY, text, placed) {
  const maxW = 260;
  const lines = wrap(text, maxW);
  const bw = Math.min(maxW, Math.max(...lines.map(l => ctx.measureText(l).width))) + 26;
  const bh = lines.length * 21 + 20;
  let bx = Math.max(8, Math.min(W - bw - 8, cx - bw/2));
  let by = topY - bh - 14;
  let g = 0;
  const hit = r => placed.some(p => !(r.x+r.w<p.x||p.x+p.w<r.x||r.y+r.h<p.y||p.y+p.h<r.y));
  let rect = {x:bx, y:Math.max(8, by), w:bw, h:bh};
  while (hit(rect) && g++ < 20 && rect.y > 8) rect.y -= 14;
  rect.y = Math.max(8, rect.y);  // never above the scene
  placed.push(rect);
  bx = rect.x; by = rect.y;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 5;
  const grad = ctx.createLinearGradient(0, by, 0, by+bh);
  grad.addColorStop(0, 'rgba(252,247,235,0.98)'); grad.addColorStop(1, 'rgba(244,236,220,0.98)');
  ctx.fillStyle = grad;
  roundRect(bx, by, bw, bh, 14); ctx.fill();
  ctx.restore();
  // tail toward the speaker
  ctx.fillStyle = 'rgba(248,241,227,0.98)';
  const tx = Math.max(bx+16, Math.min(bx+bw-16, cx));
  ctx.beginPath(); ctx.moveTo(tx-9, by+bh-1); ctx.lineTo(tx+9, by+bh-1);
  ctx.lineTo(tx, by+bh+13); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a2016'; ctx.font = '15px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'left';
  lines.forEach((l, i) => ctx.fillText(l, bx+13, by+26+i*21));
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}

/* ---- render ---- */
const TINT = { morning:'rgba(255,236,180,0.05)', midday:'rgba(255,255,255,0)',
               afternoon:'rgba(255,210,140,0.05)', evening:'rgba(50,25,60,0.12)',
               night:'rgba(12,18,50,0.24)', 'small hours':'rgba(6,10,40,0.30)' };

function actorBox(a) {
  const h = depthScale(a.y) * H;
  const w = a.img ? h * (a.img.width / a.img.height) : h * 0.4;
  return { x: a.x - w/2, y: a.y - h, w, h };
}

function frame(now) {
  ctx.clearRect(0, 0, W, H);
  if (images.cafe) ctx.drawImage(images.cafe, 0, 0, W, H);
  else { ctx.fillStyle = '#1a120b'; ctx.fillRect(0,0,W,H); }

  const list = [...actors.values()].sort((p, q) => p.y - q.y);
  for (const a of list) {
    // walk toward the spot the ENGINE says the character is at
    a.x += (a.tx - a.x) * 0.06; a.y += (a.ty - a.y) * 0.06;
    if ((!a.bubble || now > a.bubbleUntil)) {
      a.bubble = null;
      if (a.queue && a.queue.length) {
        a.bubble = a.queue.shift();
        a.bubbleUntil = now + Math.min(13000, 4000 + a.bubble.length*45);
      }
    }
    const box = actorBox(a);
    const bob = Math.sin(now/900 + a.phase) * 2;
    // shadow
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.beginPath(); ctx.ellipse(a.x, a.y-2, box.w*0.30, 8, 0, 0, 7); ctx.fill();
    ctx.restore();
    // selection / hover glow
    if (a.id === selected || a.id === hovered) {
      ctx.save();
      ctx.shadowColor = a.id === selected ? '#e0a94e' : '#ffffffaa';
      ctx.shadowBlur = 26;
      if (a.img) ctx.drawImage(a.img, box.x, box.y+bob, box.w, box.h);
      ctx.restore();
    }
    if (a.img) ctx.drawImage(a.img, box.x, box.y+bob, box.w, box.h);
    // name plate
    ctx.font = '600 13px "Segoe UI", system-ui, sans-serif';
    const lw = ctx.measureText(a.name).width + 18;
    ctx.fillStyle = a.id === selected ? 'rgba(224,169,78,0.92)' : 'rgba(0,0,0,0.6)';
    roundRect(a.x - lw/2, a.y + 4, lw, 20, 10); ctx.fill();
    ctx.fillStyle = a.id === selected ? '#201408' : '#efe6d5';
    ctx.textAlign = 'center'; ctx.fillText(a.name, a.x, a.y + 18);
    ctx.textAlign = 'left';
  }
  // bubbles on top, collision-stacked
  const placed = [];
  for (const a of list) {
    const box = actorBox(a);
    if (a.thinking) drawBubble(a.x, box.y, '·'.repeat(1 + Math.floor(now/380)%3), placed);
    else if (a.bubble && now < a.bubbleUntil) drawBubble(a.x, box.y, a.bubble, placed);
  }
  ctx.fillStyle = TINT[clockPhase] ?? TINT.evening; ctx.fillRect(0, 0, W, H);
  if (worldPaused) { ctx.fillStyle = 'rgba(30,8,8,0.28)'; ctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(frame);
}

/* ---- picking ---- */
function actorAt(ev) {
  const r = cv.getBoundingClientRect();
  const mx = (ev.clientX-r.left)*W/r.width, my = (ev.clientY-r.top)*H/r.height;
  let best=null, bestZ=-1;
  for (const a of actors.values()) {
    if (a.id === 'you') continue;
    const b = actorBox(a);
    if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h && a.y>bestZ) { best=a; bestZ=a.y; }
  }
  return best;
}
cv.addEventListener('mousemove', ev => {
  const a = actorAt(ev); hovered = a ? a.id : null;
  cv.style.cursor = a ? 'pointer' : 'default';
});
cv.addEventListener('click', ev => {
  const a = actorAt(ev); if (!a) return;
  selected = a.id; $('target').textContent = a.name; $('hint').style.display = 'none';
  ($('name').value.trim() ? $('msg') : $('name')).focus();
});

/* ---- world state ---- */
async function loadRoom() {
  let r;
  try { r = await (await fetch('/gateway/room')).json(); }
  catch { $('worldmeta').textContent = 'offline'; return; }
  $('cafe').textContent = r.cafe;
  clockPhase = r.clock_time; worldPaused = r.paused;
  $('statusdot').className = 'dot' + (r.paused ? ' paused' : '');
  $('worldmeta').textContent =
    `tick ${r.tick} · ${r.clock_time} · ${r.weather}` + (r.paused ? ' · paused' : '');
  if (r.paused) { $('banner').textContent = 'The world is paused';
                  $('banner').classList.add('alert'); $('banner').style.display='block'; }
  else if ($('banner').classList.contains('alert')) {
    $('banner').style.display='none'; $('banner').classList.remove('alert'); }
  const ids = new Set(r.occupants.map(o => o.id));
  for (const id of [...actors.keys()]) if (!ids.has(id) && id!=='you') actors.delete(id);
  relayout(r.occupants);
  $('ejectsel').innerHTML = r.occupants.map(o =>
    `<option value="${o.id}">${o.name}</option>`).join('');
}

/* ---- SSE ---- */
function startFeed() {
  const es = new EventSource('/gateway/events');
  es.onmessage = ev => {
    const e = JSON.parse(ev.data);
    if (e.tool === 'say') say(e.actor, e.text);
    else if (e.tool === 'emote') say(e.actor, e.text, true);
    else if (e.tool === 'move_to') { /* position updates via room poll */ }
    else if (e.tool === 'event_seed') banner(e.text);
    else if (e.tool === 'eject') actors.delete(e.actor);
    const div = document.createElement('div');
    div.innerHTML = `<span class="tk">t${e.tick}</span> ` +
      `<span class="actor">${e.actor}</span> ${e.text || '<em>'+e.tool+'</em>'}`;
    $('feed').prepend(div);
    while ($('feed').children.length > 50) $('feed').lastChild.remove();
  };
  es.onerror = () => {};
}
let bannerTimer;
function banner(text) {
  if (worldPaused) return;
  $('banner').textContent = text; $('banner').style.display = 'block';
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => {
    if (!$('banner').classList.contains('alert')) $('banner').style.display = 'none'; }, 13000);
}

/* ---- chat ---- */
function bubbleMsg(cls, who, text) {
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  d.innerHTML = `<div class="who">${who}</div>`;
  const body = document.createElement('div'); body.textContent = text; d.appendChild(body);
  $('chatlog').appendChild(d); $('chatlog').scrollTop = $('chatlog').scrollHeight;
  return body;
}
async function send() {
  const name = $('name').value.trim(), text = $('msg').value.trim();
  if (!name) return $('name').focus();
  if (!text) return $('msg').focus();
  if (!selected) { bubbleMsg('npc pending','system','Click a figure in the café first.'); return; }
  localStorage.setItem('interval-name', name);
  const npc = actors.get(selected), npcName = npc?.name || selected;
  // place YOU in the scene beside the person you're addressing
  let you = actors.get('you');
  if (!you) {
    you = { id:'you', name, x:W*0.5, y:H*0.9, tx:W*0.5, ty:H*0.9,
            img:images.visitor, queue:[], bubble:null, bubbleUntil:0, phase:0 };
    actors.set('you', you);
  }
  you.name = name;
  if (npc) { const side = npc.tx < W*0.5 ? 1 : -1;
             you.tx = npc.tx + side*W*0.12; you.ty = npc.ty + 6; }
  say('you', text);
  bubbleMsg('me', name, text);
  $('msg').value=''; $('send').disabled = true;
  const pend = bubbleMsg('npc pending', npcName, '…'); if (npc) npc.thinking = true;
  try {
    const res = await fetch('/gateway/chat', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({display_name:name, target:selected, text}) });
    const data = await res.json();
    const reply = res.ok ? data.reply : (data.detail || 'no answer');
    pend.parentElement.classList.remove('pending'); pend.textContent = reply;
    say(selected, reply);
  } catch(e) { pend.textContent = 'the café did not answer — ' + e; }
  if (npc) npc.thinking = false; $('send').disabled = false; $('msg').focus();
}
$('send').onclick = send;
$('msg').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('name').addEventListener('keydown', e => { if (e.key==='Enter') $('msg').focus(); });

/* ---- operator ---- */
async function op(kind, arg) {
  const token = $('admintoken').value.trim();
  if (!token) { $('opstatus').textContent = 'admin token required'; return; }
  const headers = {'Authorization':'Bearer '+token, 'Content-Type':'application/json'};
  const res = kind === 'pause'
    ? await fetch('/admin/pause', {method:'POST', headers, body:JSON.stringify({paused:arg})})
    : await fetch('/admin/eject/'+$('ejectsel').value, {method:'POST', headers});
  $('opstatus').textContent = res.ok ? `${kind} ok` : `${kind} failed (${res.status})`;
  loadRoom();
}

/* ---- boot ---- */
(async () => {
  images.cafe = await loadImg('/assets/cafe.jpg');
  for (const k of [...KNOWN, 'visitor'])
    images[k] = await loadImg(`/assets/${k}.png`);
  await loadRoom(); startFeed();
  setInterval(loadRoom, 8000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
