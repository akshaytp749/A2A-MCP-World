[project]
name = "the-interval"
version = "0.1.0"
description = "The Interval — a persistent one-room agent world (A2A + MCP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "mcp>=1.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "a2a-sdk>=1.1",
    "google-genai>=2.10",
    "langfuse>=4.13",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine", "npc", "gateway", "gate", "llm"]
